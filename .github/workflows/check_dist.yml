name: Check dist

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-dist:
    name: Check dist is up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      - name: Install dependencies
        run: npm ci

      - name: Build JS bundle
        run: npm run build

      - name: Check for uncommitted changes in dist/
        run: |
          if ! git diff --exit-code dist/index.js dist/post.js; then
            echo "dist/index.js or dist/post.js is out of date. Run 'npm run build' locally and commit the result."
            exit 1
          fi
